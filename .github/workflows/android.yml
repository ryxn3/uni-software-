name: Build Android APK

on:
  push:
    branches:
      - claude/vocab-training-app-krrmvr
      - main
    paths:
      - vocab/**
      - android-app/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VOKABO_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: android-app
        run: npm ci

      - name: Bundle web app and sync Android project
        working-directory: android-app
        run: npm run sync

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Vokabo.apk
          # Some browsers stall on .apk downloads; a zip downloads like any file
          zip -j Vokabo.zip Vokabo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vokabo-apk
          path: |
            Vokabo.apk
            Vokabo.zip

      - name: Publish as "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Vokabo.apk Vokabo.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Vokabo for Android (build ${{ github.run_number }})" \
            --notes "Latest APK built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Open this page on your phone, tap **Vokabo.apk**, and allow installing from your browser when Android asks. If the .apk download gets stuck, download **Vokabo.zip** instead, open it in the Files app and tap the Vokabo.apk inside."
